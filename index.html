<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregnancy Runner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f8ff;
            font-family: 'Arial', sans-serif;
        }
        .game-container {
            position: relative;
            width: 800px;
            height: 300px;
        }
        canvas {
            border: 2px solid #ffb6c1;
            background-color: #e6f7ff;
        }
        .game-ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #333;
            font-size: 18px;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 182, 193, 0.9);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .nutrients-bar {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }
        .nutrients-fill {
            height: 100%;
            width: 0%;
            background-color: #ff69b4;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="300"></canvas>
        <div class="game-ui">
            <div id="score">Score: 0</div>
            <div id="trimester">Trimester: 1</div>
            <div id="weeks">Weeks: 1</div>
        </div>
        <div class="nutrients-bar">
            <div id="nutrientsFill" class="nutrients-fill"></div>
        </div>
        <div id="gameOver">
            <h2>Game Over!</h2>
            <p>Press SPACE to restart</p>
        </div>
    </div>
    <script>
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.canvas.width = 800;
                this.canvas.height = 300;

                // Game state
                this.score = 0;
                this.nutrients = 0;
                this.trimester = 1;
                this.weeks = 1;
                this.gameSpeed = 2;
                this.gravity = 0.4;
                this.isGameOver = false;
                this.isPaused = false;

                // Character properties
                this.character = {
                    x: 50,
                    y: this.canvas.height - 100,
                    width: 40,
                    height: 80,
                    velocityY: 0,
                    isJumping: false,
                    isDucking: false,
                    bellySize: 0,
                    jumpHeight: -12, // Starting jump height
                    speed: 1, // Starting speed
                    baseSpeed: 1 // Store base speed for reference
                };

                // Game objects
                this.obstacles = [];
                this.nutrientItems = [];

                // Event listeners
                this.setupEventListeners();

                // Start the game loop
                this.gameLoop();
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        if (this.isGameOver) {
                            this.restart();
                        } else if (!this.character.isJumping) {
                            this.jump();
                        }
                    }
                    if (e.code === 'ArrowDown') {
                        e.preventDefault();
                        this.character.isDucking = true;
                    }
                    if (e.code === 'KeyP') {
                        this.togglePause();
                    }
                });

                document.addEventListener('keyup', (e) => {
                    if (e.code === 'ArrowDown') {
                        this.character.isDucking = false;
                    }
                });
            }

            updatePregnancy() {
                // Update weeks based on score - now 200 points = 1 week
                this.weeks = Math.min(40, Math.floor(this.score / 200) + 1);

                // Update trimester based on weeks
                if (this.weeks <= 13) {
                    this.trimester = 1;
                } else if (this.weeks <= 26) {
                    this.trimester = 2;
                } else {
                    this.trimester = 3;
                }

                // Update belly size based on weeks
                this.character.bellySize = Math.min(1, this.weeks / 40);

                // Update character abilities based on weeks
                // More pronounced decrease in jump height
                this.character.jumpHeight = -12 + (this.weeks * 0.3);

                // Drastic speed reduction after 40 weeks
                if (this.weeks >= 40) {
                    this.character.speed = 0.1; // Extremely slow crawl
                } else {
                    this.character.speed = 1 - (this.weeks * 0.02);
                }

                // Update UI
                document.getElementById('trimester').textContent = `Trimester: ${this.trimester}`;
                document.getElementById('weeks').textContent = `Weeks: ${this.weeks}`;
            }

            jump() {
                this.character.isJumping = true;
                this.character.velocityY = this.character.jumpHeight;
            }

            togglePause() {
                this.isPaused = !this.isPaused;
            }

            update() {
                if (this.isPaused || this.isGameOver) return;

                // Update character position
                this.character.velocityY += this.gravity;
                this.character.y += this.character.velocityY;

                // Ground collision
                if (this.character.y > this.canvas.height - this.character.height) {
                    this.character.y = this.canvas.height - this.character.height;
                    this.character.isJumping = false;
                    this.character.velocityY = 0;
                }

                // Update score
                this.score++;
                document.getElementById('score').textContent = `Score: ${this.score}`;

                // Spawn nutrients
                if (this.score % 60 === 0) {
                    this.spawnNutrient();
                }

                // Update game objects
                this.updateNutrients();
                this.checkCollisions();
                this.updatePregnancy();
            }

            spawnNutrient() {
                this.nutrientItems.push({
                    x: this.canvas.width,
                    y: Math.random() * (this.canvas.height - 100) + 50,
                    width: 15,
                    height: 15,
                    value: 5
                });
            }

            updateNutrients() {
                for (let i = this.nutrientItems.length - 1; i >= 0; i--) {
                    const nutrient = this.nutrientItems[i];
                    nutrient.x -= this.gameSpeed * this.character.speed;

                    if (nutrient.x + nutrient.width < 0) {
                        this.nutrientItems.splice(i, 1);
                    }
                }
            }

            checkCollisions() {
                // Check nutrient collisions
                for (let i = this.nutrientItems.length - 1; i >= 0; i--) {
                    if (this.detectCollision(this.character, this.nutrientItems[i])) {
                        this.nutrientItems.splice(i, 1);
                        this.nutrients += 5;
                        document.getElementById('nutrientsFill').style.width = `${this.nutrients}%`;
                    }
                }
            }

            detectCollision(obj1, obj2) {
                return obj1.x < obj2.x + obj2.width &&
                       obj1.x + obj1.width > obj2.x &&
                       obj1.y < obj2.y + obj2.height &&
                       obj1.y + obj1.height > obj2.y;
            }

            gameOver() {
                this.isGameOver = true;
                document.getElementById('gameOver').style.display = 'block';
            }

            restart() {
                this.score = 0;
                this.nutrients = 0;
                this.trimester = 1;
                this.weeks = 1;
                this.gameSpeed = 2;
                this.isGameOver = false;
                this.character.y = this.canvas.height - 100;
                this.character.velocityY = 0;
                this.character.bellySize = 0;
                this.character.jumpHeight = -12;
                this.character.speed = 1;
                this.obstacles = [];
                this.nutrientItems = [];
                document.getElementById('gameOver').style.display = 'none';
                document.getElementById('score').textContent = `Score: ${this.score}`;
                document.getElementById('trimester').textContent = `Trimester: ${this.trimester}`;
                document.getElementById('weeks').textContent = `Weeks: ${this.weeks}`;
                document.getElementById('nutrientsFill').style.width = '0%';
            }

            drawCharacter() {
                this.ctx.save();
                this.ctx.translate(this.character.x, this.character.y);

                // Draw body
                this.ctx.fillStyle = '#FFD3B6';
                this.ctx.fillRect(0, 0, this.character.width, this.character.height);

                // Draw pregnant belly - moved higher up
                this.ctx.fillStyle = '#FFB6C1';
                const bellyWidth = this.character.width * (1 + this.character.bellySize);
                const bellyHeight = this.character.height * (0.5 + this.character.bellySize * 0.3);
                this.ctx.beginPath();
                this.ctx.ellipse(
                    this.character.width / 2,
                    this.character.height * 0.5, // Changed from 0.7 to 0.5 to move belly higher
                    bellyWidth / 2,
                    bellyHeight / 2,
                    0, 0, Math.PI * 2
                );
                this.ctx.fill();

                // Draw head
                this.ctx.fillStyle = '#FFD3B6';
                this.ctx.beginPath();
                this.ctx.arc(
                    this.character.width / 2,
                    -10,
                    15,
                    0,
                    Math.PI * 2
                );
                this.ctx.fill();

                this.ctx.restore();
            }

            draw() {
                // Clear canvas
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw character
                this.drawCharacter();

                // Draw nutrients
                this.ctx.fillStyle = '#FF69B4';
                for (const nutrient of this.nutrientItems) {
                    this.ctx.beginPath();
                    this.ctx.arc(
                        nutrient.x + nutrient.width/2,
                        nutrient.y + nutrient.height/2,
                        nutrient.width/2,
                        0,
                        Math.PI * 2
                    );
                    this.ctx.fill();
                }
            }

            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        // Start the game
        new Game();
    </script>
</body>
</html>
